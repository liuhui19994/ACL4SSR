mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
ipv6: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
dns:
  enable: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
  use-hosts: true
  enhanced-mode: fake-ip
  fake-ip-filter:
    - geosite:cn
    - geosite:apple
    - "*.apple.com"
    - "*.icloud.com"
    - "*.mzstatic.com"
    - "*.aaplimg.com"
    - "*.cdn-apple.com"
  nameserver:
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  respect-rules: true

proxies:
  # ==== 换成你自己的 9 条节点：server / port / 认证字段 逐条改，name 不要改 ====
  - {name: "🇭🇰 HK- DMIT", type: ss, server: 192.0.2.1, port: 8388, cipher: aes-256-gcm, password: "CHANGE_ME", udp: true}
  - {name: "🇨🇳 台湾S01 |Hinet", type: ss, server: 192.0.2.2, port: 8388, cipher: aes-256-gcm, password: "CHANGE_ME", udp: true}
  - {name: "🇭🇰 香港S03 | IEPL", type: ss, server: 192.0.2.3, port: 8388, cipher: aes-256-gcm, password: "CHANGE_ME", udp: true}
  - {name: "🇸🇬 SG-Vultr", type: ss, server: 192.0.2.4, port: 8388, cipher: aes-256-gcm, password: "CHANGE_ME", udp: true}
  - {name: "🇸🇬 SG-AWS", type: ss, server: 192.0.2.5, port: 8388, cipher: aes-256-gcm, password: "CHANGE_ME", udp: true}
  - {name: "🇯🇵 JP-Vultr2", type: ss, server: 192.0.2.6, port: 8388, cipher: aes-256-gcm, password: "CHANGE_ME", udp: true}
  - {name: "🇯🇵 JP-Vultr", type: ss, server: 192.0.2.7, port: 8388, cipher: aes-256-gcm, password: "CHANGE_ME", udp: true}
  - {name: "🇺🇸 US-Oracle", type: ss, server: 192.0.2.8, port: 8388, cipher: aes-256-gcm, password: "CHANGE_ME", udp: true}
  - {name: "🇺🇸 US-IT7", type: ss, server: 192.0.2.9, port: 8388, cipher: aes-256-gcm, password: "CHANGE_ME", udp: true}

