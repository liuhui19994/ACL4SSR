    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🇺🇲 美国节点
      - 🇸🇬 狮城节点
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇹🇼 台湾节点
      - ☑️ 手动切换
      - DIRECT
  - name: 📱 Meta
    type: select
    proxies:
      - 🤖 OpenAi
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🇺🇲 美国节点
      - 🇸🇬 狮城节点
      - 🇭🇰 香港节点
      - 🇹🇼 台湾节点
      - 🇯🇵 日本节点
      - ☑️ 手动切换
      - DIRECT
  - name: 📹 油管视频
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🇸🇬 狮城节点
      - 🇭🇰 香港节点
      - 🇹🇼 台湾节点
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - ☑️ 手动切换
      - DIRECT
  - name: 📺 台湾媒体
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🇹🇼 台湾节点
      - 🇭🇰 香港节点
      - 🇸🇬 狮城节点
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - ☑️ 手动切换
      - DIRECT
  - name: 🌍 国外媒体
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🇭🇰 香港节点
      - 🇹🇼 台湾节点
      - 🇸🇬 狮城节点
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - ☑️ 手动切换
      - DIRECT
    filter: MITM|emby|Emby
  - name: 🌏 国内媒体
    type: select
    proxies:
      - DIRECT
      - 🇭🇰 香港节点
      - 🇹🇼 台湾节点
      - 🇸🇬 狮城节点
      - 🇯🇵 日本节点
      - ☑️ 手动切换
  - name: 📢 谷歌FCM
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
      - 🇺🇲 美国节点
      - 🇭🇰 香港节点
      - 🇹🇼 台湾节点
      - 🇸🇬 狮城节点
      - 🇯🇵 日本节点
      - ☑️ 手动切换
  - name: 🍎 苹果服务
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
      - 🇺🇲 美国节点
      - 🇭🇰 香港节点
      - 🇹🇼 台湾节点
      - 🇸🇬 狮城节点
      - 🇯🇵 日本节点
      - ☑️ 手动切换
  - name: 🎯 全球直连
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
      - ♻️ 自动选择
  - name: 🛑 广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT
  - name: 🍃 应用净化
    type: select
    proxies:
      - REJECT
      - DIRECT
  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - DIRECT
      - 🇭🇰 香港节点
      - 🇹🇼 台湾节点
      - 🇸🇬 狮城节点
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - ☑️ 手动切换
  - name: 🇭🇰 香港节点
    type: load-balance
    use:
      - airport
    filter: 港|HK|hk|Hong Kong|HongKong|hongkong|HKG
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: 🇯🇵 日本节点
    type: load-balance
    use:
      - airport
    filter: 日本|川日|东京|大阪|泉日|埼玉|沪日|深日|[^-]日|JP|Japan|Tokyo|NRT|KIX
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: 🇺🇲 美国节点
    type: load-balance
    use:
      - airport
    filter: 美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States|ATL|BUF|DFW|EWR|IAD|LAX|MCI|MIA|ORD|PHX|PDX|SEA|SJC
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 150
  - name: 🇹🇼 台湾节点
    type: load-balance
    use:
      - airport
    filter: 台|新北|彰化|TW|Taiwan|TPE|KHH
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: 🇸🇬 狮城节点
    type: load-balance
    use:
      - airport
    filter: 新加坡|坡|狮城|SG|Singapore|SIN
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
