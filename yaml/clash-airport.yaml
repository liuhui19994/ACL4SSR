mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
ipv6: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
dns:
  enable: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
  use-hosts: true
  enhanced-mode: fake-ip
  fake-ip-filter:
    - geosite:cn
    - geosite:apple
    - "*.apple.com"
    - "*.icloud.com"
    - "*.mzstatic.com"
    - "*.aaplimg.com"
    - "*.cdn-apple.com"
  nameserver:
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  respect-rules: true

proxy-providers:
  airport:
    type: http
    # ★★★ 把这一行换成你的机场订阅地址（必须是 Clash / Mihomo 格式的订阅）★★★
    url: "https://PASTE-YOUR-AIRPORT-SUBSCRIPTION-URL-HERE"
    path: ./providers/airport.yaml
    interval: 86400
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300

proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - 🇭🇰 香港节点
      - 🇹🇼 台湾节点
      - 🇸🇬 狮城节点
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - ☑️ 手动切换
      - DIRECT
  - name: ☑️ 手动切换
    type: select
    use:
      - airport
  - name: ♻️ 自动选择
    type: url-test
    proxies:
      - 🇭🇰 香港节点
      - 🇸🇬 狮城节点
      - 🇯🇵 日本节点
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
  - name: 📲 电报消息
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🇸🇬 狮城节点
      - 🇭🇰 香港节点
      - 🇹🇼 台湾节点
      - 🇯🇵 日本节点
      - 🇺🇲 美国节点
      - ☑️ 手动切换
      - DIRECT
